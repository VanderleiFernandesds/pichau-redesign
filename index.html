<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pichau — conceito de redesign</title>
    <meta name="description" content="Conceito de uma loja gamer com busca, favoritos e carrinho demonstrativo." />
    <!-- O ?v= força os navegadores a buscar o ícone de novo; aumente ao trocar o favicon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <!--
      Aplica o tema salvo antes da primeira pintura, para o modo claro não piscar escuro ao carregar.
      A chave é a mesma de THEME_STORAGE_KEY (src/hooks/useTheme.js).
    -->
    <script>
      try {
        if (localStorage.getItem('pichau-theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <!--
      As fontes (declaradas em src/index.css) e o fundo do primeiro slide do hero, que é o LCP, só
      seriam descobertos depois do CSS e do JavaScript. O preload começa o download junto com o HTML;
      o Vite troca os caminhos pelos arquivos com hash no build. Ao mudar o primeiro slide
      (HERO_SLIDES em src/data/heroCampaigns.js), troque o fundo abaixo.
    -->
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/rajdhani-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/rajdhani-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/src/assets/images/banners/energy-drink/fundo-1192x475.avif"
      as="image"
      type="image/avif"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

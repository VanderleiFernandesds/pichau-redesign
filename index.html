<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pichau — conceito de redesign</title>
    <meta name="description" content="Conceito de uma loja gamer com busca, favoritos e carrinho demonstrativo." />
    <!--
      Prévia ao compartilhar o link (LinkedIn, WhatsApp, X, Slack). A imagem (public/og-image.jpg,
      1200x630) é uma captura do topo da home; os endereços precisam ser absolutos.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Pichau — conceito de redesign" />
    <meta property="og:description" content="Conceito de uma loja gamer com busca, favoritos e carrinho demonstrativo." />
    <meta property="og:url" content="https://vanderleifernandesds.github.io/pichau-redesign/" />
    <meta property="og:image" content="https://vanderleifernandesds.github.io/pichau-redesign/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Home do conceito de redesign da Pichau, com o banner do Pichau Energy Drink" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- O ?v= força os navegadores a buscar o ícone de novo; aumente ao trocar o favicon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <!--
      Aplica o tema salvo antes da primeira pintura, para o modo claro não piscar escuro ao carregar.
      A chave é a mesma de THEME_STORAGE_KEY (src/hooks/useTheme.js).
    -->
    <script>
      try {
        if (localStorage.getItem('pichau-theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
    <!--
      As fontes (declaradas em src/index.css) e o fundo do primeiro slide do hero, que é o LCP, só
      seriam descobertos depois do CSS e do JavaScript. O preload começa o download junto com o HTML;
      o Vite troca os caminhos pelos arquivos com hash no build. Ao mudar o primeiro slide
      (HERO_SLIDES em src/data/heroCampaigns.js), troque o fundo abaixo. Com arte própria para o
      celular (background.mobile), cada preload leva a media do <source> do CampaignBackground, para
      só a arte usada ser baixada.
    -->
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/rajdhani-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/rajdhani-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/src/assets/images/banners/energy-drink/fundo-1985x792.avif"
      as="image"
      type="image/avif"
      media="(width >= 1001px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/src/assets/images/banners/energy-drink/fundo-celular-1122x1402.avif"
      as="image"
      type="image/avif"
      media="(width < 1001px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
